<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/footer.css">
</head>


<body class="d-flex flex-column min-vh-100" style="font-family:'Inter',
sans-serif;">
  <main class="flex-grow-1 d-flex justify-content-center align-items-center bg-white m-5">
    <div class="container" style="max-width: 600px;">
      <div class="text-center m-4">
        <img src="assets/images/Shared/frame35181.png" alt="Bookdiverse logo" class="img-fluid" style="width: 80px;">
      <div class="text-center text-wrap text-md-nowrap">
          <p class="mt-3 fs-5 fs-md-4 fs-lg-3" style="font-weight: 550;">Create Your Bookdiverse Account</p>
      </div>        
      </div>

      <form>
        <div class="mb-3">
          <label for="fullname" class="form-label fw-medium">Full Name</label>
          <input type="text" class="form-control rounded-3" id="fullname" placeholder="Full Name" style="border: 1px solid #aba6a6;">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-medium">Email</label>
          <input type="email" class="form-control rounded-3" id="email" placeholder="Email" style="border: 1px solid #aba6a6;">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-medium">Password</label>
          <input type="password" class="form-control rounded-3" id="password" placeholder="Password" style="border: 1px solid #aba6a6;">
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
          <input type="password" class="form-control rounded-3" id="confirmPassword" placeholder="Confirm Password" style="border: 1px solid #aba6a6;">
        </div>

        <a href="login.html" class="btn w-100 text-white rounded-3 py-2 fw-semibold text-decoration-none d-block text-center" style="background-color: #f3687f;">
          Sign up
        </a>

        <p class="text-center mt-3 mb-1 small" style="font-size: 15px;">
          By signing up, you agree with our <a href="#" class="text-decoration-none" style="color: #6eaaf7;">terms</a>
        </p>
        <p class="text-center small" style="font-size: 20px;">
          Already have an account? <a href="login.html" class="text-decoration-none" style="color: #6eaaf7;">Log in</a>
        </p>
      </form>
    </div>
  </main>

  
    <div class="footer img-fluid w-100">
        <div>
            <img class="footer1 img-fluid w-100" src="assets/images/homepagepic/rectangle80.png" alt="image color pink">
            <img class="footer2" src="assets/images/homepagepic/frame35181.png" alt="Bookdiverse image">
        </div>
        <div class="footer-text d-flex flex-column flex-md-row text-center text-md-start">
            <div class="text1">
            <h3>Library</h3>
            <p>Genres</p>
            <p>Languages</p>
            <p>Authors</p>
            </div>
            <div class="text2">
            <h3>Company</h3>
            <p>About us</p>
            <p>Help</p>
            <p>Become A Partner</p>
            </div>
            <div class="text3 text-center">
            <h3>Get the app</h3>
            <div class="text-img d-flex justify-content-center align-items-center gap-4">
                <img src="assets/images/homepagepic/google-play1.png" alt="google-play1">
                <img src="assets/images/homepagepic/app-store1.png" alt="app-store1">
            </div>
            </div>
        </div>
        <hr class="border border-1 border-light opacity-100 my-4">
        <div class="footerb d-flex flex-column flex-md-row text-center text-md-start">
            <div class="footerb1 d-flex align-items-end gap-2">
            <div>
                <h3>Contact us:</h3>  
            </div>
            <img src="assets/images/homepagepic/logos_facebook.png" alt="facebook logo">
            <img src="assets/images/homepagepic/group.png" alt="instagram logo">
            <img src="assets/images/homepagepic/group(1).png" alt="twitter logo">
            <img src="assets/images/homepagepic/vector.png" alt="tikitok logo">
            </div>
            <h3>Terms and Privacy</h3>
            <h3>Delivery & Returns</h3>
        </div>
        <hr class="border border-1 border-light opacity-100 my-4">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
