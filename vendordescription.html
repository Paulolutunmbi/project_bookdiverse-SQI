<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Description - Bookdiverse</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/footer.css">
    <link rel="stylesheet" href="assets/css/vendordescription.css">
</head>
<body style="margin:0; padding:0; overflow-x:hidden;">
  
  <!-- Vendor Description Content -->
  <div class="vendor-description-container">
    <div class="container">
      <div class="description-card">
        <p class="instruction-text">
          You are one step away from setting up your profile! Kindly write a short description about your bookstore in the box below.
        </p>
        
        <form class="description-form">
          <textarea 
            id="bookstoreDescription" 
            class="description-textarea" 
            placeholder="Not more than 50 words"
            maxlength="350"
            rows="6"
            required
          ></textarea>
          
          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer (DO NOT MODIFY) -->
  <div class="footer img-fluid w-100">
    <div>
      <img class="footer1 img-fluid w-100" src="assets/images/homepagepic/rectangle80.png" alt="image color pink">
      <img class="footer2" src="assets/images/homepagepic/frame35181.png" alt="Bookdiverse image">
    </div>
    <div class="footer-text d-flex flex-column flex-md-row text-center text-md-start">
      <div class="text1">
        <h3>Library</h3>
        <p>Genres</p>
        <p>Languages</p>
        <p>Authors</p>
      </div>
      <div class="text2">
        <h3>Company</h3>
        <p>About us</p>
        <p>Help</p>
        <p>Become A Partner</p>
      </div>
      <div class="text3 text-center">
        <h3>Get the app</h3>
        <div class="text-img d-flex justify-content-center align-items-center gap-4">
          <img src="assets/images/homepagepic/google-play1.png" alt="google-play1">
          <img src="assets/images/homepagepic/app-store1.png" alt="app-store1">
        </div>
      </div>
    </div>
    <hr class="border border-1 border-light opacity-100 my-4">
    <div class="footerb d-flex flex-column flex-md-row text-center text-md-start">
      <div class="footerb1 d-flex align-items-end gap-2">
        <div>
          <h3>Contact us:</h3>  
        </div>
        <img src="assets/images/homepagepic/logos_facebook.png" alt="facebook logo">
        <img src="assets/images/homepagepic/group.png" alt="instagram logo">
        <img src="assets/images/homepagepic/group(1).png" alt="twitter logo">
        <img src="assets/images/homepagepic/vector.png" alt="tikitok logo">
      </div>
        <h3>Terms and Privacy</h3>
        <h3>Delivery & Returns</h3>
    </div>
    <hr class="border border-1 border-light opacity-100 my-4">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
